<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Event Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.1/css/dataTables.dataTables.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/3.0.0/css/responsive.dataTables.min.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">Football Event Tracker</a>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-sm btn-outline-light" data-bs-toggle="modal" data-bs-target="#exampleModal">Info</button>
      <button type="button" class="btn btn-sm btn-success" onclick="downloadCSV()">Export CSV</button>
    </div>
  </nav>

  <!-- Info Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Info</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>This is a modified version of the event tracker <a href="https://splxgoal-jkomar.pythonanywhere.com/?trk=article-ssr-frontend-pulse_little-text-block">here</a>.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-primary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid py-3">
    <div class="row g-3">
      <!-- Pitch + Controls -->
      <div class="col-lg-6">
        <h5 class="pitch-heading">Pitch</h5>
        <div class="pitch-container mb-3">
          <div id="pitch"></div>
        </div>
        <div class="card p-3">
          <div class="row g-2 align-items-end">
            <!-- Row 1: Half / Min / Sec -->
            <div class="col-12 col-sm-4">
              <label class="form-label">Half</label>
              <input type="number" value="1" id="half" onchange="halfsave()" class="form-control form-control-sm" />
            </div>
            <div class="col-12 col-sm-4">
              <label class="form-label">Min</label>
              <input type="number" value="0" id="min" onchange="minsave()" class="form-control form-control-sm" />
            </div>
            <div class="col-12 col-sm-4">
              <label class="form-label">Sec</label>
              <input type="number" value="0" id="sec" onchange="secsave()" class="form-control form-control-sm" />
            </div>
            <!-- Row 2: Team buttons (full width below) -->
            <div class="col-12 d-flex gap-2 mt-1">
              <button class="btn btn-sm btn-outline-primary flex-fill team-button" onclick="setTeam.call(this, 'team 1');">team 1</button>
              <button class="btn btn-sm btn-outline-primary flex-fill team-button" onclick="setTeam.call(this, 'team 2');">team 2</button>
            </div>
          </div>
        </div>
        <div class="card p-3 mb-3">
          <h5 class="heading">Player</h5>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-sm btn-outline-primary player-button" onclick="setPlayer.call(this, 'GK');">GK</button>
            <button class="btn btn-sm btn-outline-primary player-button" onclick="setPlayer.call(this, 'def');">Def</button>
            <button class="btn btn-sm btn-outline-primary player-button" onclick="setPlayer.call(this, 'mid');">Mid</button>
            <button class="btn btn-sm btn-outline-primary player-button" onclick="setPlayer.call(this, 'fwd');">Fwd</button>
          </div>
        </div>
      </div>

      <!-- Event Controls -->
      <div class="col-lg-6">
        <div class="card p-3 mb-3">
          <h5 class="heading">Event</h5>
          <div class="row">
            <div class="col-sm-6">
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'shot');">shot</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'pass');">pass</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'dribble');">dribble</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'goal kick');">goal kick</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'goalie restart');">goalie restart</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'foul');">foul</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'opp goal');">opp goal</button>
            </div>
            <div class="col-sm-6">
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'free kick');">free kick</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'corner');">corner</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'throw in');">throw in</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'interception');">interception</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'tackle');">tackle</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'clearance');">clearance</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'game start');">game start</button>
              <button class="btn btn-sm btn-outline-primary w-100 event-button" onclick="setActionType.call(this, 'game stop');">game stop</button>
            </div>
          </div>
        </div>

        <div class="card p-3 mb-3">
          <h5 class="heading">Detail</h5>

            <!-- Line 1 -->
            <div class="d-flex flex-wrap gap-2 mb-2">
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'complete');">Complete</button>
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'incomplete');">Incomplete</button>
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'blocked');">Blocked</button>
            </div>

            <!-- Line 2 -->
            <div class="d-flex flex-wrap gap-2 mb-2">
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'goal');">Goal</button>
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'on target');">On target</button>
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'off target');">Off target</button>
            </div>

            <!-- Line 3 -->
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'won ball');">Won ball</button>
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'lost ball');">Lost ball</button>
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'injury');">Injury</button>
              <button class="btn btn-sm btn-outline-primary detail-button" onclick="setDetail.call(this, 'half');">Half</button>
            </div>
          </div>

        <div class="card p-3">
          <h5 class="heading">Surface</h5>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-sm btn-outline-primary surface-button" onclick="setSurface.call(this, 'foot');">foot</button>
            <button class="btn btn-sm btn-outline-primary surface-button" onclick="setSurface.call(this, 'head');">head</button>
            <button class="btn btn-sm btn-outline-primary surface-button" onclick="setSurface.call(this, 'volley');">volley</button>
            <button class="btn btn-sm btn-outline-primary surface-button" onclick="setSurface.call(this, 'punt');">punt</button>
            <button class="btn btn-sm btn-outline-primary surface-button" onclick="setSurface.call(this, 'pass');">pass</button>
            <button class="btn btn-sm btn-outline-primary surface-button" onclick="setSurface.call(this, 'throw');">throw</button>
          </div>
        </div>
        
        <div class="card p-3 mb-3">
          <h5 class="heading">Pass Detail</h5>
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-sm btn-outline-primary pass-detail-button" onclick="setPassDetail.call(this, 'line-break');">line-break</button>
              <button class="btn btn-sm btn-outline-primary pass-detail-button" onclick="setPassDetail.call(this, 'through ball');">through ball</button>
              <button class="btn btn-sm btn-outline-primary pass-detail-button" onclick="setPassDetail.call(this, 'cutback');">cutback</button>
              <button class="btn btn-sm btn-outline-primary pass-detail-button" onclick="setPassDetail.call(this, 'cross');">cross</button>
              <button class="btn btn-sm btn-outline-primary pass-detail-button" onclick="setPassDetail.call(this, 'offside');">offside</button>
            </div>
        </div>
      </div>
    </div>

    <!-- Events Table -->
    <div class="tracked-events mt-4">
      <h5>Tracked Events</h5>
      <div class="event-table-wrapper">
        <table id="event-table" class="table table-sm table-hover table-bordered dt-responsive">
          <thead class="table-dark">
            <tr>
              <th>time</th>
              <th>detail</th>
              <th>pass detail</th>
              <th>event</th>
              <th>surface</th>
              <th>x1</th>
              <th>y1</th>
              <th>x2</th>
              <th>y2</th>
              <th>half</th>
              <th>min</th>
              <th>sec</th>
              <th>player</th>
              <th>team</th>
              <th>X</th>
            </tr>
          </thead>
          <tbody class="events"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.1/js/dataTables.js"></script>
  <script src="https://cdn.datatables.net/responsive/3.0.0/js/dataTables.responsive.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
