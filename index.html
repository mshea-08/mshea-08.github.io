<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Event Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.1/css/dataTables.dataTables.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/3.0.0/css/responsive.dataTables.min.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">Football Event Tracker</a>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-sm btn-outline-light" data-bs-toggle="modal" data-bs-target="#exampleModal">Info</button>
      <button type="button" class="btn btn-sm btn-success" onclick="downloadCSV()">Export CSV</button>
    </div>
  </nav>

  <!-- Info Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Info</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>This is a modified version of the event tracker <a href="https://splxgoal-jkomar.pythonanywhere.com/?trk=article-ssr-frontend-pulse_little-text-block">here</a>.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-primary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid py-3">
    <div class="row g-3">
      <!-- Pitch + Controls -->
      <div class="col-lg-6">
        <h5 class="pitch-heading">Pitch</h5>
        <div class="pitch-container mb-3">
          <div id="pitch"></div>
        </div>
        <div class="card p-3">
          <div class="row g-2 align-items-end">
            <div class="col-4">
              <label class="form-label">Half</label>
              <input type="number" value="1" id="half" onchange="halfsave()" class="form-control form-control-sm" />
            </div>
            <div class="col-4">
              <label class="form-label">Min</label>
              <input type="number" value="0" id="min" onchange="minsave()" class="form-control form-control-sm" />
            </div>
            <div class="col-4">
              <label class="form-label">Sec</label>
              <input type="number" value="0" id="sec" onchange="secsave()" class="form-control form-control-sm" />
            </div>
            <div class="col-12 d-flex gap-2 mt-2">
              <div id="teamButtons" class="d-flex w-100 gap-2">
                <button class="btn btn-sm btn-outline-primary flex-fill team-button" data-key="team1" onclick="setTeam.call(this, 'team 1');">Team 1 (N)</button>
                <button class="btn btn-sm btn-outline-primary flex-fill team-button" data-key="team2" onclick="setTeam.call(this, 'team 2');">Team 2 (M)</button>
              </div> 
            </div>
          </div>
        </div>
      </div>

      <!-- Event Controls -->
      <div class="col-lg-6">
        <div class="card p-3 mb-3">
          <h5 class="heading">Event</h5>
            <div class="card p-3 mb-3">
              <div id="eventButtons" class="d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-outline-primary event-button" data-key="shot"             onclick="setActionType.call(this, 'shot');">Shot (A)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="cross"            onclick="setActionType.call(this, 'cross');">Cross (S)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="pass"             onclick="setActionType.call(this, 'pass');">Pass (D)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="dribble"          onclick="setActionType.call(this, 'dribble');">Dribble (F)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="goal_kick"        onclick="setActionType.call(this, 'goal kick');">Goal kick (G)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="goalie_restart"   onclick="setActionType.call(this, 'goalie restart');">Goalie restart (H)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="foul"             onclick="setActionType.call(this, 'foul');">Foul</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="opp_goal"         onclick="setActionType.call(this, 'opp goal');">Opponent Goal</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="free_kick"        onclick="setActionType.call(this, 'free kick');">Free kick (J)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="free_kick_shot"   onclick="setActionType.call(this, 'free kick shot');">Free kick shot (K)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="corner"           onclick="setActionType.call(this, 'corner');">Corner (L)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="throw_in"         onclick="setActionType.call(this, 'throw in');">Throw in (;)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="interception"     onclick="setActionType.call(this, 'interception');">Interception (.)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="tackle"           onclick="setActionType.call(this, 'tackle');">Tackle (,)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="clearance"        onclick="setActionType.call(this, 'clearance');">Clearance (/)</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="game_start"       onclick="setActionType.call(this, 'game start');">Game Start</button>
                <button class="btn btn-sm btn-outline-primary event-button" data-key="game_stop"        onclick="setActionType.call(this, 'game stop');">Game Stop</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card p-3 mb-3">
          <h5 class="heading">Detail</h5>
            <div class="card p-3 mb-3">
            <div id="detailButtons" class="d-flex flex-wrap gap-2">
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="goal"        onclick="setDetail.call(this, 'goal');">Goal</button>
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="on_target"   onclick="setDetail.call(this, 'on target');">On target</button>
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="off_target"  onclick="setDetail.call(this, 'off target');">Off target</button>
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="blocked"     onclick="setDetail.call(this, 'blocked');">Blocked</button>
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="complete"    onclick="setDetail.call(this, 'complete');">Complete</button>
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="incomplete"  onclick="setDetail.call(this, 'incomplete');">Incomplete</button>
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="offside"     onclick="setDetail.call(this, 'offside');">Offside</button>
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="won_ball"    onclick="setDetail.call(this, 'won ball');">Won ball</button>
              <button class="btn btn-sm btn-outline-primary detail-button" data-key="lost_ball"   onclick="setDetail.call(this, 'lost ball');">Lost ball</button>
            </div>
          </div>
        </div>

        <div class="card p-3">
          <h5 class="heading">Surface</h5>
            <div class="card p-3">
            <div id="surfaceButtons" class="d-flex flex-wrap gap-2">
              <button class="btn btn-sm btn-outline-primary surface-button" data-key="foot"   onclick="setSurface.call(this, 'foot');">Foot</button>
              <button class="btn btn-sm btn-outline-primary surface-button" data-key="head"   onclick="setSurface.call(this, 'head');">Head</button>
              <button class="btn btn-sm btn-outline-primary surface-button" data-key="volley" onclick="setSurface.call(this, 'volley');">Volley</button>
              <button class="btn btn-sm btn-outline-primary surface-button" data-key="punt"   onclick="setSurface.call(this, 'punt');">Punt</button>
              <button class="btn btn-sm btn-outline-primary surface-button" data-key="pass"   onclick="setSurface.call(this, 'pass');">Pass</button>
              <button class="btn btn-sm btn-outline-primary surface-button" data-key="throw"  onclick="setSurface.call(this, 'throw');">Throw</button>
            </div>
          </div>
      </div>
    </div>

    <!-- Events Table -->
    <div class="tracked-events mt-4">
      <h5>Tracked Events</h5>
      <div class="event-table-wrapper">
        <table id="event-table" class="table table-sm table-hover table-bordered dt-responsive">
          <thead class="table-dark">
            <tr>
              <th>time</th><th>detail</th><th>event</th><th>surface</th>
              <th>x1</th><th>y1</th><th>x2</th><th>y2</th>
              <th>half</th><th>min</th><th>sec</th><th>team</th><th>X</th>
            </tr>
          </thead>
          <tbody class="events"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.1/js/dataTables.js"></script>
  <script src="https://cdn.datatables.net/responsive/3.0.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
